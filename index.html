<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Wayframe Advisors</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #1a1d20;
            --text-muted: #59626a;
            --primary: #0b61ff;
            --primary-hover: #004fe5;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .contact-card h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .contact-card p {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .btn-primary {
            display: inline-block;
            background-color: var(--primary);
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(11, 97, 255, 0.2);
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h1>Let’s Grow Your Brand</h1>
        <p>Navigating the ever-changing landscape of communication and marketing can be challenging. Let Wayframe Advisors help you cut through the noise and achieve your goals.</p>
        <a href="mailto:info@wayframeadvisors.com" class="btn-primary">Get in Touch</a>
    </div>

</body>
</html>
